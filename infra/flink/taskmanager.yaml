apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: stream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      component: taskmanager
  template:
    metadata:
      labels:
        app: flink
        component: taskmanager
    spec:
      containers:
        - name: taskmanager
          image: allocknguyen/flink-ml-full:v3
          args: ["taskmanager"]
          ports:
            - containerPort: 6121
          resources:
            limits:
              memory: "4Gi"   
              cpu: "1000m"
            requests:
              memory: "2Gi"
              cpu: "500m"
          volumeMounts:
            - name: config-volume
              mountPath: /opt/flink/conf/flink-conf.yaml
              subPath: flink-conf.yaml
            - name: flink-config-volume
              mountPath: /opt/flink/usrlib/init.sql
              subPath: init.sql
            - name: flink-config-volume
              mountPath: /opt/flink/usrlib/fraud_prediction.py
              subPath: fraud_prediction.py
            - name: flink-config-volume
              mountPath: /opt/flink/usrlib/fraud_model.json
              subPath: fraud_model.json
          env:
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: flink-jobmanager
                jobmanager.rpc.port: 6123
                jobmanager.memory.process.size: 1024m
                jobmanager.bind-host: 0.0.0.0
                rest.port: 8081
                blob.server.port: 6124
                parallelism.default: 2
                state.backend: rocksdb
                state.checkpoints.dir: file:///tmp/flink-checkpoints
                execution.checkpointing.interval: 10s
                s3.endpoint: http://my-minio.data-storage:9000
                s3.access-key: admin
                s3.secret-key: admin123
                s3.path.style.access: true
      volumes:
        - name: config-volume
          configMap:
            name: flink-config
            # Khai báo rõ ràng key nào trong ConfigMap sẽ được dùng
            items:
              - key: flink-conf.yaml
                path: flink-conf.yaml
        - name: flink-config-volume
          configMap:
            name: flink-config
          